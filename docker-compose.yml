services:
  db:
    image: pgvector/pgvector:pg16
    container_name: fsp_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-fsp}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-fsp}
      POSTGRES_DB: ${POSTGRES_DB:-fsp}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-fsp} -d ${POSTGRES_DB:-fsp}"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  api:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        WITH_JDK: ${WITH_JDK:-0}
    container_name: fsp_api
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-fsp}:${POSTGRES_PASSWORD:-fsp}@db:5432/${POSTGRES_DB:-fsp}
      PYTHONPATH: /app
      PYTHONUNBUFFERED: "1"
    ports:
      - "${API_PORT:-8000}:8000"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./:/app:cached
      # Локальная копия корпуса тестовых заданий (git clone https://github.com/Hexlet/ru-test-assignments data/ru-test-assignments)
      - ${KNOWLEDGE_HOST_DIR:-./data}:/data:ro
    command: ["/entrypoint.sh"]

volumes:
  pgdata:
    driver: local